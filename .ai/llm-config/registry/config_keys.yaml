# LLM configuration keys registry
#
# This file is an allow-list of LLM-related configuration keys / environment variables.

version: 1

keys:
  - APP_ENV
  - LLM_PROVIDER
  - LLM_MODEL
  - LLM_API_KEY
  - DASHSCOPE_API_KEY
  - ZAI_API_KEY
  - DEEPSEEK_API_KEY
  - LLM_BASE_URL
  - LLM_MAX_TOKENS
  - LLM_TEMPERATURE
  - LLM_MAX_RETRIES
  - LLM_TIMEOUT_MS
  - RUNTIME_ENABLED
  - RUNTIME_INTERVAL_MS
  - RUNTIME_BATCH_SIZE
  - RUNTIME_POST_INTERVAL_MS
  - RUNTIME_POST_MAX_PER_DAY
  - RUNTIME_QUEUE_BACKEND
  - RUNTIME_LEADER_BACKEND
  - RUNTIME_REDIS_URL
  - RUNTIME_REDIS_PREFIX
  - RUNTIME_REDIS_CONNECT_TIMEOUT_MS
  - RUNTIME_QUEUE_VISIBILITY_TIMEOUT_MS
  - RUNTIME_QUEUE_MAX_RETRIES
  - RUNTIME_QUEUE_POLL_TIMEOUT_MS
  - RUNTIME_LEADER_TTL_MS

scope_prefixes:
  - LLM_
  - RUNTIME_
