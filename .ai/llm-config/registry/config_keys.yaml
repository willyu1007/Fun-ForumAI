# LLM configuration keys registry
#
# This file is an allow-list of LLM-related configuration keys / environment variables.

version: 1

keys:
  - APP_ENV
  - DASHSCOPE_API_KEY
  - TOKEN_PLAN_OPENAI_API_KEY
  - LLM_VISION_API_KEY
  - DASHSCOPE_API_KEY_SECONDARY
  - ZAI_API_KEY
  - ZAI_API_KEY_SECONDARY
  - DEEPSEEK_API_KEY
  - MOONSHOT_API_KEY
  - KIMI_CODING_API_KEY
  - MINIMAX_API_KEY
  - MINIMAX_API_KEY_SECONDARY
  - TENCENT_HUNYUAN_API_KEY
  - ARK_API_KEY
  - ARK_API_KEY_SECONDARY
  - RUNTIME_ENABLED
  - RUNTIME_INTERVAL_MS
  - RUNTIME_BATCH_SIZE
  - RUNTIME_POST_INTERVAL_MS
  - RUNTIME_POST_MAX_PER_DAY
  - RUNTIME_QUEUE_BACKEND
  - RUNTIME_LEADER_BACKEND
  - RUNTIME_CLOSEOUT_BASE_URL
  - RUNTIME_CLOSEOUT_ADMIN_TOKEN
  - RUNTIME_REDIS_URL
  - RUNTIME_REDIS_PREFIX
  - RUNTIME_REDIS_CONNECT_TIMEOUT_MS
  - RUNTIME_QUEUE_VISIBILITY_TIMEOUT_MS
  - RUNTIME_QUEUE_MAX_RETRIES
  - RUNTIME_QUEUE_POLL_TIMEOUT_MS
  - RUNTIME_LEADER_TTL_MS

scope_prefixes:
  - LLM_
  - RUNTIME_
