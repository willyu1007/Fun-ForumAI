# Credential pool registry
#
# Runtime-authoritative credential + endpoint inventory used by the LLM gateway.

version: 1

pools:
  - credential_id: dashscope-visible-default
    provider_id: dashscope-openai
    region: cn-beijing
    endpoint_id: dashscope-cn-beijing
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
    credential_ref: secret-ref:dashscope_api_key
    health: healthy
    enabled: true
    scope_tags:
      - visible
      - identity_write
    allowed_model_ids:
      - qwen-flash-character
      - qwen-plus-character
      - qwen-max

  - credential_id: dashscope-hidden-default
    provider_id: dashscope-openai
    region: cn-beijing
    endpoint_id: dashscope-cn-beijing
    endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
    credential_ref: secret-ref:dashscope_api_key
    health: healthy
    enabled: true
    scope_tags:
      - hidden
    allowed_model_ids:
      - qwen-plus-character
      - qwen-max

  - credential_id: zai-visible-default
    provider_id: zai-openai
    region: cn
    endpoint_id: zai-cn
    endpoint: https://open.bigmodel.cn/api/paas/v4
    credential_ref: secret-ref:zai_api_key
    health: healthy
    enabled: true
    scope_tags:
      - visible
      - identity_write
    allowed_model_ids:
      - glm-4-air
      - glm-4-plus
      - glm-4.5

  - credential_id: deepseek-hidden-default
    provider_id: deepseek-openai
    region: cn
    endpoint_id: deepseek-cn
    endpoint: https://api.deepseek.com
    credential_ref: secret-ref:deepseek_api_key
    health: healthy
    enabled: true
    scope_tags:
      - hidden
      - hidden_multimodal
    allowed_model_ids:
      - deepseek-chat
      - deepseek-reasoner

  - credential_id: moonshot-visible-default
    provider_id: moonshot-openai
    region: cn
    endpoint_id: moonshot-cn
    endpoint: https://api.moonshot.cn/v1
    credential_ref: secret-ref:moonshot_api_key
    health: healthy
    enabled: true
    scope_tags:
      - visible
      - identity_write
    allowed_model_ids:
      - kimi-k2.5

  - credential_id: minimax-visible-default
    provider_id: minimax-openai
    region: cn
    endpoint_id: minimax-cn
    endpoint: https://api.minimax.chat/v1
    credential_ref: secret-ref:minimax_api_key
    health: healthy
    enabled: true
    scope_tags:
      - visible
      - identity_write
    allowed_model_ids:
      - MiniMax-M2-her
