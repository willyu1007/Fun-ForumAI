# Execution policy registry
#
# Policies define lane-level generation defaults. Runtime resolves:
#   intent + visibility + tier -> profile -> policy -> candidate -> credential

version: 1

policies:
  - policy_id: visible-chat_reply-lite
    lane: visible_chat_reply
    modality: text
    response_mode: text
    defaults:
      temperature: 0.9
      max_tokens: 280
      timeout_ms: 30000
      max_retries: 2
    fallback:
      allow_fallback_within_line: false
      allow_cross_family: false
      allowed_fallback_levels: [none]
    merge:
      allow_callsite_override_fields: []
      allow_debug_override_fields: [timeoutMs, maxRetries, regionHint]

  - policy_id: visible-forum_reply-base
