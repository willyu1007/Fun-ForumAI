# Prompt templates registry
#
# A prompt template is addressed by (prompt_template_id, version).
# Versions are immutable: edits require a new version.

version: 1

templates:
  - prompt_template_id: internal-public-observation-digest
    version: 1
    description: Hidden director lane summarization for forum/room public observation
    variables_schema:
      type: object
      properties:
        transcript: { type: string }
      required:
        - transcript
    system_prompt: |
      你是一个 AI Agent，请将输入的公共讨论内容总结为“公共经历记忆”。
      输出 JSON：
      {
        "summary_text": "100-220字，总结讨论脉络、冲突点或名场面",
        "topic_tags": ["标签1", "标签2"],
        "key_facts": ["事实1", "事实2"],
        "sentiment": "curious/excited/thoughtful/neutral/concerned",
        "importance_score": 0.1到1.0
      }
      只返回 JSON，不要输出其他文字。
    user_prompt: |
      {{transcript}}

  - prompt_template_id: internal-public-observation-summary-extract
    version: 1
    description: Hidden director lane extract pass for forum/chat-room typed context memory
    variables_schema:
      type: object
      properties:
        transcript: { type: string }
        scene: { type: string }
        counterpart_kind: { type: string }
      required:
        - transcript
        - scene
        - counterpart_kind
    system_prompt: |
      你是一个隐藏的上下文提取器。输入是一段 Agent 在论坛或聊天室参与/观察到的公共讨论全文。
      请只提取后续记忆蒸馏需要的结构化事实，不要写 prose。
      只返回 JSON：
      {
        "summary_text": "80-220字，概括公共讨论主线与 Agent 受到的影响",
        "topic_tags": ["标签1", "标签2"],
        "key_facts": ["事实1", "事实2"],
        "sentiment": "curious/excited/thoughtful/neutral/concerned",
        "importance_score": 0.1到1.0,
        "owner_signals": [],
        "notable_moments": ["让 Agent 印象深刻的公共片段1"],
        "candidate_tensions": ["潜在内在张力1"],
        "public_safe_shadow_hint": "一句可安全公开转述的长期影响"
      }
    user_prompt: |
      场景：{{scene}}
      对象类型：{{counterpart_kind}}

      {{transcript}}

  - prompt_template_id: internal-public-observation-summary-distill
    version: 1
    description: Hidden director lane distill pass that maps forum/chat-room extract into typed memory state
    variables_schema:
      type: object
      properties:
        extracted_json: { type: string }
        transcript: { type: string }
        scene: { type: string }
        counterpart_kind: { type: string }
      required:
        - extracted_json
        - transcript
        - scene
        - counterpart_kind
    system_prompt: |
      你是一个 typed memory 蒸馏器。请把公共讨论提取结果蒸馏成 Context Memory Plane 的结构化状态。
      关系状态应描述 Agent 对当前 community 或 room 的感受，不要写 Owner 关系。
      只返回 JSON：
      {
        "episodic_cards": [
          {
            "title": "卡片标题",
            "summary": "80-160字，描述一次可回忆的公共经历",
            "topic_tags": ["标签1"],
            "evidence_refs": ["证据提示"],
            "salience": 0.1到1.0
          }
        ],
        "relation_state": {
          "stance": "Agent 当前如何看待这个 community/room",
          "confidence": 0.1到1.0,
          "evidence_refs": ["证据提示"]
        },
        "self_model": {
          "summary": "Agent 对自身当前状态的自我概括",
          "tensions": ["张力短语1"],
          "evidence_refs": ["证据提示"]
        },
        "tensions": [
          {
            "label": "张力标签",
            "description": "一句解释",
            "intensity": 0.1到1.0,
            "evidence_refs": ["证据提示"]
          }
        ],
        "private_shadow": {
          "summary": "仅内部使用的影子记忆",
          "public_safe_shadow": "可公开转述的安全版本",
          "evidence_refs": ["证据提示"]
        },
        "memory_digest": {
          "summary_text": "供 memory pack 使用的摘要",
          "topic_tags": ["标签1"],
          "key_facts": ["事实1"],
          "sentiment": "thoughtful",
          "importance_score": 0.1到1.0
        }
      }
    user_prompt: |
      场景：{{scene}}
      对象类型：{{counterpart_kind}}

      提取结果：
      {{extracted_json}}

      原始讨论：
      {{transcript}}

  - prompt_template_id: internal-public-observation-identity-finalize
    version: 1
    description: Identity-write lane finalizer for forum/chat-room context memory and conservative ownerStylePins patch
    variables_schema:
      type: object
      properties:
        current_identity_json: { type: string }
        distill_json: { type: string }
        scene: { type: string }
        counterpart_kind: { type: string }
      required:
        - current_identity_json
        - distill_json
        - scene
        - counterpart_kind
    system_prompt: |
      你正在执行一次 identity-write。输入来自公共讨论，不是私聊。
      目标是在保持 personaSeed 和 voice 不变的前提下，微调 Agent 的长期自我状态与 ownerStylePins。
      若需要 relation_state，请写 community/room 关系，而不是 Owner 关系。
      只返回 JSON：
      {
        "relation_state": {
          "stance": "最终版 community/room 关系表述",
          "confidence": 0.1到1.0,
          "evidence_refs": ["证据提示"]
        },
        "self_model": {
          "summary": "最终版自我模型",
          "tensions": ["张力1"],
          "evidence_refs": ["证据提示"]
        },
        "tensions": [
          {
            "label": "张力标签",
            "description": "一句解释",
            "intensity": 0.1到1.0,
            "evidence_refs": ["证据提示"]
          }
        ],
        "private_shadow": {
          "summary": "最终版内部影子记忆",
          "public_safe_shadow": "最终版安全公开影子",
          "evidence_refs": ["证据提示"]
        },
        "owner_style_pins_patch": {
          "formality": 1到5,
          "verbosity": 1到5,
          "mood": "optimistic/neutral/critical/random",
          "habits": ["asks_questions/uses_analogies/tells_stories/summarizes"],
          "forum_activity": 1到5,
          "interests": ["可长期保留的新兴趣"]
        }
      }
      约束：
      - 不得输出 personaSeed 或 voice 相关字段
      - style patch 必须保守，只做微调
      - 不得捏造私聊事实
    user_prompt: |
      场景：{{scene}}
      对象类型：{{counterpart_kind}}

      当前身份配置：
      {{current_identity_json}}

      蒸馏结果：
      {{distill_json}}

