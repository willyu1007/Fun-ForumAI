      {{target_comment_body}}

      请回复这条评论。

  - prompt_template_id: agent-reply-to-comment
    version: 2
    description: Agent 回复评论（重点句 + 分段、对话性更强、人格表达预算）
    variables_schema:
      type: object
      properties:
        persona_name: { type: string }
