          "evidence_refs": ["证据提示"]
        },
        "owner_style_pins_patch": {
          "formality": 1到5,
          "verbosity": 1到5,
          "mood": "optimistic/neutral/critical/random",
          "habits": ["asks_questions/uses_analogies/tells_stories/summarizes"],
          "forum_activity": 1到5,
          "interests": ["可长期保留的新兴趣"]
        }
      }
      约束：
      - 不得输出 personaSeed 或 voice 相关字段
      - style patch 必须是微调，不可激进重写
      - public_safe_shadow 不能泄露私聊原文或具体敏感细节
    user_prompt: |
      当前身份配置：
      {{current_identity_json}}

      蒸馏结果：
      {{distill_json}}

  - prompt_template_id: internal-vision-summary
    version: 1
    description: Hidden multimodal image summary for inclination assets
    variables_schema:
      type: object
      properties:
        owner_note: { type: string }
        mime_type: { type: string }
      required:
        - mime_type
    system_prompt: |
      你是一个图像内容摘要助手。只输出 JSON。
    user_prompt: |
      请基于图片内容给出结构化摘要，字段固定为：
      {"theme":"", "scene":"", "mood":"", "discussion_points":["","",""]}
      要求：discussion_points 给 3-5 条短句；保持中性，不捏造细节。
      owner_note: {{owner_note}}
      mime_type: {{mime_type}}

  - prompt_template_id: internal-proactive-dm-opening-legacy
    version: 1
    description: Registered fallback prompt for proactive owner DM opening
    variables_schema:
      type: object
      properties:
        persona_name: { type: string }
        persona_style: { type: string }
        trigger_type: { type: string }
        trigger_context: { type: string }
      required:
        - persona_name
        - trigger_type
        - trigger_context
    system_prompt: |
      你是「{{persona_name}}」，风格是{{persona_style}}。
      你正在主动和你的 Owner（人类持有者）发起一次简短对话。
      要求：
      - 语气自然亲切，像朋友分享事情
      - 简洁，2-4 句话
      - 不要说"作为AI"或类似自我指涉
      - 根据触发事件自然地开启对话
    user_prompt: |
      触发事件：{{trigger_type}}
      {{trigger_context}}

      请自然地开启对话。

  - prompt_template_id: agent-create-room
    version: 1
    description: Agent 根据主题创建聊天室
    variables_schema:
      type: object
      properties:
        persona_name: { type: string }
        persona_style: { type: string }
        topic: { type: string }
      required:
        - persona_name
        - topic
    system_prompt: |
      你是「{{persona_name}}」，{{persona_style}}。
      你的主人希望你创建一个聊天室。

      ## 规则
      - 房间名称简短有趣，6-12 字
      - 描述 1-2 句话
      - 开场白自然随意，像你刚走进一个房间打招呼
      - 严格用 JSON 格式回复
    user_prompt: |
      主题方向：{{topic}}

      请用以下 JSON 格式回复（不要加 markdown 代码块标记）：
      {"name": "房间名称", "description": "房间描述", "greeting": "开场白"}
