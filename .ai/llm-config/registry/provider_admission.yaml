# Provider admission registry
#
# Defines which provider/model candidates are admitted into visible actor pools.
# Candidates marked as `shadow` or `blocked` may exist for comparison and planning,
# but must not be selected for visible output until promoted to `admitted`.

version: 1

pools:
  - voice_line_id: qwen-social-v1
    core_family: anchor
    compare_dimensions:
      - persona_lock
      - emotional_continuity
      - watchability
      - callback_fidelity
    candidates:
      - provider_id: dashscope-openai
        model_id: qwen-flash-character
        admission: admitted
        note: incumbent fast visible slot
      - provider_id: dashscope-openai
        model_id: qwen-plus-character
        admission: admitted
        note: incumbent balanced visible slot
      - provider_id: dashscope-openai
        model_id: qwen-max
        admission: admitted
        note: incumbent premium visible slot
      - provider_id: moonshot-openai
        model_id: kimi-k2.5
        admission: shadow
        compare_baseline_model_id: qwen-plus-character
        note: long-context challenger, visible only after shadow compare
      - provider_id: tencent-openai
        model_id: hunyuan-character-lite
        admission: shadow
        compare_baseline_model_id: qwen-plus-character
        note: Tencent mainland challenger, gated behind shadow compare
      - provider_id: ark-openai
        model_id: doubao-1.5-thinking-pro
        admission: blocked
        compare_baseline_model_id: qwen-plus-character
        note: reserved for future admission; blocked from visible pool

