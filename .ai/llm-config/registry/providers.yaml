# LLM providers registry
#
# Runtime SSOT for stable provider identifiers and baseline runtime capabilities.
# These entries are contract-first and must remain provider-agnostic from feature code.

version: 1

providers:
  - provider_id: dashscope-openai
    display_name: DashScope OpenAI-Compatible
    gateway_kind: openai_compatible
    auth:
      type: api_key
      credential_ref_required: true
      credential_ref: env:LLM_API_KEY
    routing:
      regions:
        - cn-beijing
      default_region: cn-beijing
    capabilities:
      chat: true
      json_mode: true
      tool_calling: true
      streaming: true
    defaults:
      timeout_ms: 30000
      max_retries: 2

  - provider_id: zai-openai
    display_name: ZAI OpenAI-Compatible
    gateway_kind: openai_compatible
    auth:
      type: api_key
      credential_ref_required: true
      credential_ref: secret-ref:zai/default
    routing:
      regions:
        - cn
      default_region: cn
    capabilities:
      chat: true
      json_mode: true
      tool_calling: true
      streaming: true
    defaults:
      timeout_ms: 30000
      max_retries: 2

  - provider_id: deepseek-openai
    display_name: DeepSeek OpenAI-Compatible
    gateway_kind: openai_compatible
    auth:
      type: api_key
      credential_ref_required: true
      credential_ref: secret-ref:deepseek/default
    routing:
      regions:
        - cn
      default_region: cn
    capabilities:
      chat: true
      json_mode: true
      tool_calling: true
      streaming: true
    defaults:
      timeout_ms: 30000
      max_retries: 2
