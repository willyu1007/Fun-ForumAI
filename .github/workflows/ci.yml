name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: UI build (tokens, contract, theme)
        run: pnpm ui:build

      - name: UI check (contract-codegen drift, theme protocol)
        run: pnpm ui:check

      - name: Unit tests
        run: pnpm test

      - name: Vite build (frontend)
        run: pnpm build

      - name: Bundle budget check
        run: pnpm ui:bundle:check

      - name: Upload bundle report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundle-report
          path: dist/frontend/bundle-report.json
          if-no-files-found: warn

      - name: Prisma schema validate
        run: pnpm db:validate

  web-playwright:
    name: Web Playwright Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright visual regression suite
        run: node .ai/skills/features/ci/scripts/ci-verify.mjs --suite web-playwright

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-regression
          path: artifacts/playwright
          if-no-files-found: warn

  governance:
    name: Governance Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Governance lint
        run: node .ai/scripts/ctl-project-governance.mjs lint --check --project main

  docker-build-validate:
    name: Docker Build Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Docker build validate
        env:
          DOCKER_BUILDKIT: "1"
        run: node ops/packaging/scripts/build.mjs --target llm-forum --tag llm-forum:ci-validate --build-profile staging-launch

  mobile-runtime-scaffold:
    name: Mobile Runtime Scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mobile typecheck
        run: pnpm mobile:typecheck

      - name: Mobile tests
        run: pnpm mobile:test

      - name: Mobile config check
        run: pnpm mobile:config:check

      - name: Mobile smoke scaffold validate
        run: pnpm mobile:smoke:validate

  launch-readiness:
    name: Launch Readiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Launch readiness verification
        run: pnpm verify:launch:ci

      - name: Upload results (JSON)
        if: always()
        run: node scripts/verify-launch-readiness.mjs --json > launch-readiness-report.json

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-readiness-report
          path: launch-readiness-report.json
