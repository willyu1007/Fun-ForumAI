name: Publish Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA or sha-<commit> tag to approve for prod
        required: true
        type: string
      release_tag:
        description: Optional one-shot immutable release tag (for example v1.2.3)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Publish Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Enforce branch protection for public repo
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node scripts/ci/check-branch-protection.mjs --branch main

      - name: Validate publish variables
        env:
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
          ACR_API_ENDPOINT: ${{ vars.ACR_API_ENDPOINT }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_ROLE_ARN: ${{ vars.ALICLOUD_ROLE_ARN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/publish-image-context.mjs --mode publish

      - name: Validate promotion inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
          ACR_API_ENDPOINT: ${{ vars.ACR_API_ENDPOINT }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_ROLE_ARN: ${{ vars.ALICLOUD_ROLE_ARN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/ci/publish-image-context.mjs --mode promote

      - name: Verify self-hosted publish runner exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRED_RUNNER_LABELS: self-hosted,linux,x64,aliyun-vpc,acr-publish
          ALLOW_RUNNER_API_FORBIDDEN: "true"
        run: node scripts/ci/check-runner-availability.mjs

  publish-staging:
    name: Build and Push Immutable Candidate
    if: github.event_name == 'push'
    needs: [preflight]
    runs-on: [self-hosted, linux, x64, aliyun-vpc, acr-publish]
    concurrency:
      group: acr-publish-self-hosted
      cancel-in-progress: false
    timeout-minutes: 90
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stabilize git transport on self-hosted runner
        shell: bash
        run: git config --global http.version HTTP/1.1

      - name: Pre-clean self-hosted runner state
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          if [ -n "$workspace" ] && [ -d "$workspace" ] && [ "$workspace" != "/" ]; then
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h || true
          docker system df || true

      - name: Fetch source archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_REF: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/publish-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          echo "PUBLISH_SOURCE_ARCHIVE=$archive_path" >> "$GITHUB_ENV"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          curl --http1.1 --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 180 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${ARCHIVE_REF}" \
            --output "$archive_path"
          tar -xzf "$archive_path" --strip-components=1 -C "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Resolve publish context
        id: context
        env:
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
          ACR_API_ENDPOINT: ${{ vars.ACR_API_ENDPOINT }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_ROLE_ARN: ${{ vars.ALICLOUD_ROLE_ARN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/publish-image-context.mjs --mode publish

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          docker --version
          aliyun version
          df -h
          docker system df || true

      - name: Resolve docker builder mode
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx version >/dev/null 2>&1; then
            echo "DOCKER_BUILDKIT=1" >> "$GITHUB_ENV"
            echo "Using Docker BuildKit via buildx."
          else
            echo "DOCKER_BUILDKIT=0" >> "$GITHUB_ENV"
            echo "docker buildx unavailable on runner; falling back to legacy docker build."
          fi

      - name: Configure Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@b347e60e64028a4d567a8f31ca42e1b0706c3c99
        with:
          oidc-provider-arn: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALICLOUD_ROLE_ARN }}
          role-session-name: github-action-acr-publish
          role-session-expiration: 3600
          audience: sts.aliyuncs.com

      - name: Log in to ACR
        env:
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
          ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
          ACR_API_ENDPOINT: ${{ vars.ACR_API_ENDPOINT }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        shell: bash
        run: node scripts/ci/acr-login.mjs

      - name: Build immutable image locally
        env:
          SHA_REF: ${{ steps.context.outputs.sha_ref }}
          FRONTEND_BUILD_PROFILE: ${{ steps.context.outputs.frontend_build_profile }}
        shell: bash
        run: |
          set -euo pipefail
          date -u
          node ops/packaging/scripts/build.mjs \
            --target llm-forum \
            --tag "$SHA_REF" \
            --build-profile "$FRONTEND_BUILD_PROFILE"

      - name: Verify candidate launch image proof
        env:
          SHA_REF: ${{ steps.context.outputs.sha_ref }}
          FRONTEND_BUILD_PROFILE: ${{ steps.context.outputs.frontend_build_profile }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/check-image-launch-proof.mjs \
            --image-ref "$SHA_REF" \
            --expected-profile "$FRONTEND_BUILD_PROFILE"

      - name: Push immutable sha image
        env:
          SHA_REF: ${{ steps.context.outputs.sha_ref }}
        shell: bash
        run: |
          set -euo pipefail
          date -u
          docker push "$SHA_REF"

      - name: Resolve published digest
        id: publish
        env:
          SHA_REF: ${{ steps.context.outputs.sha_ref }}
          IMAGE_REF: ${{ steps.context.outputs.sha_ref }}
          CREATED_TAGS: ${{ steps.context.outputs.created_tags }}
        shell: bash
        run: |
          set -euo pipefail
          date -u
          docker pull "$SHA_REF"
          digest="$(docker image inspect "$SHA_REF" --format='{{index .RepoDigests 0}}' | sed 's/.*@//')"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "final_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "created_tags=$CREATED_TAGS" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        env:
          IMAGE_REF: ${{ steps.publish.outputs.image_ref }}
          FINAL_DIGEST: ${{ steps.publish.outputs.final_digest }}
          CREATED_TAGS: ${{ steps.publish.outputs.created_tags }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## ACR publish result"
            echo ""
            echo "- image_ref: \`$IMAGE_REF\`"
            echo "- created tags: \`$CREATED_TAGS\`"
            echo "- final digest: \`$FINAL_DIGEST\`"
            echo "- commit sha: \`$COMMIT_SHA\`"
            echo "- workflow run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup self-hosted runner artifacts
        if: always()
        env:
          SHA_REF: ${{ steps.context.outputs.sha_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SHA_REF:-}" ]; then
            docker image rm -f "${SHA_REF}" || true
          fi
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          if [ -n "${PUBLISH_SOURCE_ARCHIVE:-}" ]; then
            rm -f "${PUBLISH_SOURCE_ARCHIVE}" || true
          fi
          workspace="${GITHUB_WORKSPACE:-}"
          if [ -n "$workspace" ] && [ -d "$workspace" ] && [ "$workspace" != "/" ]; then
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi
          df -h || true
          docker system df || true

  promote-prod:
    name: Approve Existing Immutable Image for Prod
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight]
    runs-on: [self-hosted, linux, x64, aliyun-vpc, acr-publish]
    concurrency:
      group: acr-publish-self-hosted
      cancel-in-progress: false
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Stabilize git transport on self-hosted runner
        shell: bash
        run: git config --global http.version HTTP/1.1

      - name: Pre-clean self-hosted runner state
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:-}"
          if [ -n "$workspace" ] && [ -d "$workspace" ] && [ "$workspace" != "/" ]; then
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          df -h || true
          docker system df || true

      - name: Fetch source archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARCHIVE_REF: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/publish-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          echo "PUBLISH_SOURCE_ARCHIVE=$archive_path" >> "$GITHUB_ENV"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          curl --http1.1 --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 180 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${ARCHIVE_REF}" \
            --output "$archive_path"
          tar -xzf "$archive_path" --strip-components=1 -C "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Resolve promotion context
        id: context
        env:
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_REPOSITORY: ${{ vars.ACR_REPOSITORY }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
          ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
          ACR_API_ENDPOINT: ${{ vars.ACR_API_ENDPOINT }}
          ALICLOUD_OIDC_PROVIDER_ARN: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
          ALICLOUD_ROLE_ARN: ${{ vars.ALICLOUD_ROLE_ARN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/ci/publish-image-context.mjs --mode promote

      - name: Check runner prerequisites
        run: |
          set -euo pipefail
          docker --version
          aliyun version
          df -h
          docker system df || true

      - name: Configure Alibaba Cloud credentials
        uses: aliyun/configure-aliyun-credentials-action@b347e60e64028a4d567a8f31ca42e1b0706c3c99
        with:
          oidc-provider-arn: ${{ vars.ALICLOUD_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.ALICLOUD_ROLE_ARN }}
          role-session-name: github-action-acr-promote
          role-session-expiration: 3600
          audience: sts.aliyuncs.com

      - name: Log in to ACR
        env:
          ALICLOUD_REGION: ${{ vars.ALICLOUD_REGION }}
          ACR_INSTANCE_ID: ${{ vars.ACR_INSTANCE_ID }}
          ACR_API_ENDPOINT: ${{ vars.ACR_API_ENDPOINT }}
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        shell: bash
        run: node scripts/ci/acr-login.mjs

      - name: Verify source image and optionally create immutable release tag
        id: promote
        env:
          SOURCE_REF: ${{ steps.context.outputs.source_ref }}
          RELEASE_REF: ${{ steps.context.outputs.release_ref }}
          CREATED_TAGS: ${{ steps.context.outputs.created_tags }}
          FRONTEND_BUILD_PROFILE: ${{ steps.context.outputs.frontend_build_profile }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SOURCE_REF"
          node scripts/ci/check-image-launch-proof.mjs \
            --image-ref "$SOURCE_REF" \
            --expected-profile "$FRONTEND_BUILD_PROFILE"
          source_digest="$(docker image inspect "$SOURCE_REF" --format='{{index .RepoDigests 0}}' | sed 's/.*@//')"

          if [ -n "$RELEASE_REF" ]; then
            if docker manifest inspect "$RELEASE_REF" >/dev/null 2>&1; then
              echo "[error] release tag already exists: $RELEASE_REF" >&2
              exit 1
            fi
            docker tag "$SOURCE_REF" "$RELEASE_REF"
            docker push "$RELEASE_REF"
            docker pull "$RELEASE_REF"
            release_digest="$(docker image inspect "$RELEASE_REF" --format='{{index .RepoDigests 0}}' | sed 's/.*@//')"
            if [ "$source_digest" != "$release_digest" ]; then
              echo "[error] release digest $release_digest does not match source digest $source_digest" >&2
              exit 1
            fi
          fi

          echo "image_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "final_digest=$source_digest" >> "$GITHUB_OUTPUT"
          echo "created_tags=$CREATED_TAGS" >> "$GITHUB_OUTPUT"

      - name: Promotion summary
        env:
          IMAGE_REF: ${{ steps.promote.outputs.image_ref }}
          FINAL_DIGEST: ${{ steps.promote.outputs.final_digest }}
          CREATED_TAGS: ${{ steps.promote.outputs.created_tags }}
          COMMIT_SHA: ${{ steps.context.outputs.commit_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## ACR prod promotion result"
            echo ""
            echo "- image_ref: \`$IMAGE_REF\`"
            echo "- created tags: \`$CREATED_TAGS\`"
            echo "- final digest: \`$FINAL_DIGEST\`"
            echo "- commit sha: \`$COMMIT_SHA\`"
            echo "- workflow run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup self-hosted runner artifacts
        if: always()
        env:
          SOURCE_REF: ${{ steps.context.outputs.source_ref }}
          RELEASE_REF: ${{ steps.context.outputs.release_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SOURCE_REF:-}" ]; then
            docker image rm -f "${SOURCE_REF}" || true
          fi
          if [ -n "${RELEASE_REF:-}" ]; then
            docker image rm -f "${RELEASE_REF}" || true
          fi
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          if [ -n "${PUBLISH_SOURCE_ARCHIVE:-}" ]; then
            rm -f "${PUBLISH_SOURCE_ARCHIVE}" || true
          fi
          workspace="${GITHUB_WORKSPACE:-}"
          if [ -n "$workspace" ] && [ -d "$workspace" ] && [ "$workspace" != "/" ]; then
            find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          fi
          df -h || true
          docker system df || true
