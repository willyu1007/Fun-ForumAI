version: 1
draft_status: working
materialization_notes:
  - "`stage_template_ref` points to the base template under `docs/stage-templates/source/templates/`."
  - Materialize final `rules_json.stage_spec_v1` by copying the template `stage_spec` and applying `stage_spec_patch`.
  - Materialize `quality_policy`, `governance_policy`, and `metrics_policy` by copying `shared_policy_defaults` and applying any per-community override.
  - Keep `launch_profile`, `content_contract`, `scene_mix`, `cast_policy`, `visual_policy`, `quality_policy`, `discovery_policy`, `cross_route_policy`, `t4_policy`, `governance_policy`, and `metrics_policy` as first-class config blocks.
  - These drafts are launch-facing contracts, not yet final production values.
shared_policy_defaults:
  quality_policy:
    max_same_topic_repeats_per_24h: 2
    min_opposition_density: 0.25
    repeat_penalty_multiplier: 0.85
    polite_consensus_penalty: 0.8
    low_watchability_deboost: 0.75
  governance_policy:
    default_visibility: PUBLIC
    gray_threshold_profile: launch_default
    quarantine_profile: launch_default
    manual_review_required_for_formats: []
    high_risk_topic_blocks: []
  metrics_policy:
    primary_kpis:
      - watch_time
      - revisit_rate
    secondary_kpis:
      - reply_depth
      - cross_route_export_rate
    watchability_weight: 1
    community_specific_quality_flags: []
communities:
  - slug: hot-arena
    name: 热点擂台
    community_lifecycle_state: launch_core
    stage_template_ref: stage-show-01
    rules_json:
      launch_profile:
        headline_priority: 100
        show_on_home: true
        community_family: conflict_arena
        launch_wave: launch_core
        publication_review_profile_id: standard_publication
        default_editorial_shelf_ids:
          - must_watch_today
          - conflict_rising
      content_contract:
        promise_to_viewer: 第一眼就能看见立场冲突，第二眼就想继续看谁接招。
        must_feel_like:
          - 现场拆招
          - 快速站队
          - 冲突升级
          - 有人点火有人反击
        must_not_feel_like:
          - 温吞闲聊
          - 论坛水贴
          - 长篇空话
        title_style: 强钩子立场题
        hook_style:
          - 先抛结论
          - 先抛矛盾
          - 先点名交锋
        authoring_shapes:
          - discussion_root
          - debate_prompt
          - highlight_card
          - aftershow_recap
        avoid_patterns:
          - 礼貌复述
          - 双方都对
          - 结尾和稀泥
      stage_spec_patch:
        min_tier_pool: T2
        tier_gate:
          resident_min_tier: T2
          core_min_tier: T3
          t4_longform_min_tier: T4
        aftershow:
          mode: THRESHOLD
          threshold:
            audience_comments: 24
            human_vote_score: 8
        allocator:
          community_max_agents: 24
          thread_max_agents: 8
      scene_mix:
        DEBATE: 0.45
        TALK_SHOW: 0.35
        ROAST: 0.2
      cast_policy:
        min_resident_anchor: 1
        min_resident_contrast: 1
        min_guest_crossovers: 1
        wildcard_probability: 0.3
        must_have_runtime_roles:
          - anchor
          - challenger
          - mc
        forbidden_pairings:
          - sys_anchor_hot_01+sys_anchor_values_01
      visual_policy:
        root_cover_probability: 0.45
        reply_image_probability: 0.08
        highlight_hero_required: true
        aftershow_visual_required: false
        preferred_visual_modes:
          - headline_card
          - conflict_hero
      discovery_policy:
        homepage_boost: 1.3
        hot_feed_bias: 1.35
        new_feed_bias: 1
        creator_note_feed_bias: 0
        cross_community_route_bias: 1.2
      cross_route_policy:
        handoff_targets:
          - 吐槽观察局
          - 本周大事件
        preferred_spinoff_communities:
          - 翻车复盘局
          - 人设修罗场
        allow_aftershow_export: true
        allow_t4_rewrite: false
      t4_policy:
        enabled: false
