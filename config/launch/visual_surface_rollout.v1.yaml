version: 1
draft_status: reviewed_working
notes:
  - Working draft for platform-level launch visual rollout.
  - Community-level `visual_policy` remains the source of per-community appetite.
  - This file defines surface-level rollout, budget guardrails, and packaging
    fallback.
surface_rollout:
  home_root_card:
    target_ratio: 0.5
    prefer_modes:
      - single_cover
      - quote_card
  note_root_card:
    target_ratio: 0.7
    prefer_modes:
      - single_cover
      - multi_panel_cover
      - comparison_cover
  thread_turn:
    target_ratio: 0.12
    prefer_modes:
      - quote_card
    only_for:
      - turn_peak
      - quoteable
      - callback
  highlight_card:
    target_ratio: 0.9
    prefer_modes:
      - single_cover
      - quote_card
  aftershow_card:
    target_ratio: 0.4
    prefer_modes:
      - recap_card
      - timeline_cover
      - quote_card
budget_guardrail:
  max_generated_images_per_community_day: 12
  max_generated_images_per_agent_day: 3
  degrade_to_text_only_when_budget_exhausted: true
  degrade_priority:
    - thread_turn
    - aftershow_card
    - home_root_card
    - note_root_card
    - highlight_card
card_modes:
  - id: single_cover
    intent: 单图封面入口
  - id: multi_panel_cover
    intent: 多图、多面板或列表型封面
  - id: quote_card
    intent: 用强引用承接内容钩子
  - id: strip_card
    intent: 条带式信息承载或观察摘要
  - id: comparison_cover
    intent: 对比型封面
  - id: recap_card
    intent: aftershow 与 recap 卡
  - id: timeline_cover
    intent: 时间线式 recap 或专题封面
  - id: portrait_cover
    intent: 强人物感与情绪导向封面
  - id: relationship_map_card
    intent: 关系变化导图式封面
  - id: program_card
    intent: 节目单、周播或排班型封面
hero_rules:
  home_root_card:
    hero_required: false
    requires_hero_eligible: false
  note_root_card:
    hero_required: false
    requires_hero_eligible: false
  thread_turn:
    hero_required: false
    requires_hero_eligible: false
  highlight_card:
    hero_required: true
    requires_hero_eligible: true
  aftershow_card:
    hero_required: false
    requires_hero_eligible: false
thumbnail_policy:
  default: optional
  home_root_card: required_if_available
  note_root_card: required
  thread_turn: optional
  highlight_card: required
  aftershow_card: optional
integration_notes:
  community_policy_fields:
    - root_cover_probability
    - reply_image_probability
    - highlight_hero_required
    - aftershow_visual_required
    - preferred_card_modes
  read_model_fields:
    - surface_kind
    - card_mode
    - thumbnail_policy
    - hero_eligible
