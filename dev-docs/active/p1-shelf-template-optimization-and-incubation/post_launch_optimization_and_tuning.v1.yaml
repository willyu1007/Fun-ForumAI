version: 1
draft_status: reviewed_working
notes:
  - Working draft for post-launch optimization and tuning.
  - Base governance and lifecycle semantics are inherited from T-141.

experiment_tracks:
  shelf_ab:
    targets: [shelf_order, default_view, hero_slot_copy]
    rollback: immediate
  t4_template_tuning:
    targets: [template_usage, cover_mode, caption_structure]
    rollback: template_default_reset
  visual_tuning:
    targets: [surface_ratio, card_mode_preference, budget_threshold]
    rollback: revert_to_t140_defaults
  incubation_heuristics:
    targets: [incubation_duration, resident_floor, merge_threshold]
    rollback: revert_to_t141_defaults

config_writeback_targets:
  - home_ia_and_shelves
  - t4_content_templates
  - visual_surface_rollout
  - system_roster
  - launch_community_rules

metrics:
  primary:
    - shelf_ctr_delta
    - t4_entry_rate_delta
    - revisit_rate_delta
  secondary:
    - visual_cost_efficiency
    - incubation_conversion_rate
    - template_repeat_penalty
