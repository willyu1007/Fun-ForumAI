version: 1

policy:
  env:
    merge:
      strategy: most-specific-wins
      tie_breaker: error

    defaults:
      auth_mode: auto
      preflight:
        mode: warn

    evidence:
      fallback_dir: .ai/.tmp/env/fallback

    preflight:
      detect:
        providers:
          cloud_a:
            env_credential_sets:
              - id_vars: [CLOUD_ACCESS_KEY_ID]
                secret_vars: [CLOUD_ACCESS_KEY_SECRET]
                token_vars: [CLOUD_SESSION_TOKEN]
            credential_files:
              paths:
                - "~/.cloud/credentials"
          cloud_b:
            env_var_presence:
              - CLOUD_APPLICATION_CREDENTIALS
            credential_files:
              paths:
                - "~/.config/cloud/application_default_credentials.json"

    # Supported auth_mode: role-only | auto | ak-only
    # Supported preflight.mode: fail | warn | off
    rules:
      - id: ecs-default
        match: { runtime_target: ecs }
        set:
          auth_mode: role-only
          preflight: { mode: fail }

      - id: prod-ecs
        match: { env: prod, runtime_target: ecs }
        set:
          auth_mode: role-only
          preflight: { mode: fail }

      - id: staging-local
        match: { env: staging, runtime_target: local }
        set:
          auth_mode: role-only
          preflight: { mode: fail }
          sts_bootstrap:
            allowed: true
            allow_ak_for_sts_only: true

      - id: dev-local
        match: { env: dev, runtime_target: local }
        set:
          auth_mode: auto
          preflight: { mode: warn }
          ak_fallback:
            allowed: true
            record: true

    secrets:
      backends:
        bws:
          # Optional defaults; keep empty to disable.
          key_prefix: ""
          scopes:
            project: {}
            shared: {}

    cloud:
      # Set to true to disallow inventory fallback and enforce policy-only routing.
      require_target: true
      defaults:
        provider: envfile
        env_file_source: "ops/deploy/env-files/{env}.env"
        env_file_name: "{env}.env"
        transport: local
        write:
          chmod: "600"
          remote_tmp_dir: "/tmp"
      targets:
        - id: staging-api
          match: { env: staging, runtime_target: ecs, workload: api }
          set:
            provider: envfile
            runtime: remote
            region: cn-hangzhou
            env_file_source: ops/deploy/env-files/staging.env
            target: /srv/apps/fun-forum/.env
            transport: local
        - id: prod-api
          match: { env: prod, runtime_target: ecs, workload: api }
          set:
            provider: envfile
            runtime: remote
            region: cn-hangzhou
            env_file_source: ops/deploy/env-files/prod.env
            target: /srv/apps/fun-forum/.env
            transport: local
        - id: staging-worker
          match: { env: staging, runtime_target: ecs, workload: worker }
          set:
            provider: aliyun-eci-container-group
            runtime: remote
            region: cn-hangzhou
            container_group:
              workload_id: eci-worker
              template: ops/deploy/workloads/eci-worker/staging.container-group.yaml
              rendered_output: .ai/.tmp/env-cloud/staging/eci-worker.rendered.yaml
              env_matrix: ops/deploy/workloads/eci-worker/env-matrix.yaml
              role_contract: ops/deploy/workloads/eci-worker/role-contract.yaml
        - id: prod-worker
          match: { env: prod, runtime_target: ecs, workload: worker }
          set:
            provider: aliyun-eci-container-group
            runtime: remote
            region: cn-hangzhou
            container_group:
              workload_id: eci-worker
              template: ops/deploy/workloads/eci-worker/prod.container-group.yaml
              rendered_output: .ai/.tmp/env-cloud/prod/eci-worker.rendered.yaml
              env_matrix: ops/deploy/workloads/eci-worker/env-matrix.yaml
              role_contract: ops/deploy/workloads/eci-worker/role-contract.yaml

  iac:
    # cloud_scope: aliyun-only | multi-cloud
    cloud_scope: aliyun-only
    # tool: none | ros | terraform | opentofu (none = IaC feature not enabled)
    tool: terraform
    evidence_dir: ops/iac/handbook
    identity:
      allow_ak: true
      forbid_runtime_injection: true
