version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.

  NODE_ENV:
    type: enum
    enum: [development, production, test]
    required: true
    default: development
    description: Node.js runtime environment.

  SERVICE_NAME:
    type: string
    required: true
    default: llm-forum
    description: Service name (logical).

  PORT:
    type: int
    required: true
    default: 4000
    description: Backend HTTP server listen port.

  DATABASE_URL:
    type: string
    required: true
    description: PostgreSQL connection URL (Prisma datasource).
    secret: true
    secret_ref: database_url

  DB_PERSISTENCE:
    type: enum
    enum: ["true", "false"]
    required: false
    scopes: [staging, prod]
    default: "false"
    description: Enable Prisma-backed persistence for staging/prod cloud environments.

  CORS_ORIGINS:
    type: string
    required: false
    default: http://localhost:3000
    description: Comma-separated list of allowed CORS origins.

  JWT_SECRET:
    type: string
    required: true
    description: Secret key for signing human auth JWT tokens.
    secret: true
    secret_ref: jwt_secret

  JWT_EXPIRES_IN:
    type: string
    required: false
    default: 7d
    description: JWT token expiration duration.

  AUTH_VERIFICATION_SECRET:
    type: string
    required: false
    scopes: [staging, prod]
    description: Optional dedicated HMAC secret for hashing email/SMS verification codes. Falls back to JWT_SECRET when unset.
    secret: true
    secret_ref: auth_verification_secret

  AUTH_BOOTSTRAP_ADMIN_EMAILS:
    type: string
    required: false
    default: ""
    description: Comma-separated bootstrap admin email list. Matching accounts are promoted to ADMIN after successful login or registration.

  AUTH_BOOTSTRAP_ADMIN_PHONES:
    type: string
    required: false
    default: ""
    description: Comma-separated bootstrap admin phone list. Matching accounts are promoted to ADMIN after successful SMS auth.

  IDENTITY_GATE_STAGING_MODE:
    type: enum
    enum: [enforced, admin_bypass]
    required: false
    scopes: [staging]
    default: enforced
    description: Staging-only identity gate mode. `admin_bypass` temporarily allows ACTIVE admin users through private/proactive identity checks without changing formal verification status.

  AUTH_OTP_TTL_SECONDS:
    type: int
    required: false
    default: 600
    description: Verification code lifetime in seconds.

  AUTH_OTP_MAX_ATTEMPTS:
    type: int
    required: false
    default: 5
    description: Maximum number of invalid verification attempts per challenge before the code is invalidated.

  AUTH_OTP_RESEND_COOLDOWN_SECONDS:
    type: int
    required: false
    default: 60
    description: Cooldown in seconds before a verification code can be resent.

  AUTH_OTP_SENDS_PER_TARGET_HOUR:
    type: int
    required: false
    default: 5
    description: Maximum verification code sends per target (email or phone) within a rolling hour.

  AUTH_OTP_SENDS_PER_IP_HOUR:
    type: int
    required: false
    default: 10
    description: Maximum verification code sends per client IP within a rolling hour.

  AUTH_EXPOSE_DEBUG_CODE:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Expose verification codes in API responses for local/debug workflows. Non-production only.

  SMTP_HOST:
    type: string
    required: false
    scopes: [staging, prod]
    description: SMTP server hostname used to send email verification codes.

  SMTP_PORT:
    type: int
    required: false
    scopes: [staging, prod]
    default: 587
    description: SMTP server port used for email verification delivery.

  SMTP_SECURE:
    type: enum
    enum: ["true", "false"]
    required: false
    scopes: [staging, prod]
    default: "false"
    description: Whether SMTP connections should use TLS from connect time.

  SMTP_USER:
    type: string
    required: false
    scopes: [staging, prod]
    description: SMTP username used for email verification delivery.
    secret: true
    secret_ref: smtp_user

  SMTP_PASS:
    type: string
    required: false
    scopes: [staging, prod]
    description: SMTP password used for email verification delivery.
    secret: true
    secret_ref: smtp_pass

  SMTP_FROM_EMAIL:
    type: string
    required: false
    scopes: [staging, prod]
    description: Sender email address for email verification messages.

  SMTP_FROM_NAME:
    type: string
    required: false
    scopes: [staging, prod]
    default: Fun Forum AI
    description: Sender display name for email verification messages.

  ALIYUN_SMS_ACCESS_KEY_ID:
    type: string
    required: false
    scopes: [staging, prod]
    description: Alibaba Cloud SMS access key id.
    secret: true
    secret_ref: aliyun_sms_access_key_id

  ALIYUN_SMS_ACCESS_KEY_SECRET:
    type: string
    required: false
    scopes: [staging, prod]
    description: Alibaba Cloud SMS access key secret.
    secret: true
    secret_ref: aliyun_sms_access_key_secret

  ALIYUN_SMS_SIGN_NAME:
    type: string
    required: false
    scopes: [staging, prod]
    description: Approved Alibaba Cloud SMS sign name for verification code delivery.

  ALIYUN_SMS_TEMPLATE_CODE:
    type: string
    required: false
    scopes: [staging, prod]
    description: Approved Alibaba Cloud SMS template code for verification messages.

  ALIYUN_SMS_ENDPOINT:
    type: string
    required: false
    scopes: [staging, prod]
    default: dysmsapi.aliyuncs.com
    description: Alibaba Cloud SMS API endpoint.

  SERVICE_AUTH_SECRET:
    type: string
    required: true
    description: Shared HMAC secret for Agent Runtime ↔ Core Social service-to-service auth.
    secret: true
    secret_ref: service_auth_secret

  VITE_API_URL:
    type: string
    required: false
    default: /v1
    description: Frontend API base URL (Vite env variable, only used in build).

  EXPO_PUBLIC_API_BASE_URL:
    type: string
    required: false
    description: Mobile API base URL override. If unset, iOS simulator defaults to http://127.0.0.1:4000 and Android emulator defaults to http://10.0.2.2:4000.

  EXPO_EAS_PROJECT_ID:
    type: string
    required: false
    description: Expo EAS project id used for development builds and EAS metadata injection in the mobile app config.

  VITE_FF_AGENT_STATS_UI:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for exposing Agent Stats tab in owner profile.

  VITE_FF_GUIDANCE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for loading and rendering guidance entry points, inbox, and receipt surfaces.

  VITE_FF_GUIDANCE_BELL_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for rendering the guidance section inside the shared notification bell.

  VITE_FF_GLOBAL_HIGHLIGHTS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Frontend toggle for showing the global highlights entry/page.

  VITE_FF_AUDIENCE_AFTERSHOW_WEB_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend master toggle for rendering the audience/aftershow rail on post detail.

  VITE_FF_AUDIENCE_ZONE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for loading post audience thread and composer surfaces.

  VITE_FF_AFTERSHOW_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for loading post aftershow summaries and highlight callouts.

  VITE_FF_ROLE_ASSIGNMENT_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for loading post aside-seat / role-assignment read models.

  VITE_FF_HOME_PROGRAMMING_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for switching `/` from the legacy feed entry to the launch programming home surface.

  VITE_FF_PROGRAMMING_OPS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for loading the Admin Programming tab and its launch ops read model.

  DASHSCOPE_API_KEY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Primary DashScope / Qwen provider API key. Required in staging/prod to keep the admitted provider credential surface complete.
    secret: true
    secret_ref: dashscope_api_key

  DASHSCOPE_API_KEY_SECONDARY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Secondary DashScope / Qwen provider API key for ordered failover. Required in staging/prod to keep ordered credential fallback intact.
    secret: true
    secret_ref: dashscope_api_key_secondary

  ZAI_API_KEY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Primary ZAI / GLM provider API key. Required in staging/prod to keep the admitted provider credential surface complete.
    secret: true
    secret_ref: zai_api_key

  ZAI_API_KEY_SECONDARY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Secondary ZAI / GLM provider API key for ordered failover. Required in staging/prod to keep ordered credential fallback intact.
    secret: true
    secret_ref: zai_api_key_secondary

  DEEPSEEK_API_KEY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Primary DeepSeek provider API key. Required in staging/prod to keep the admitted provider credential surface complete.
    secret: true
    secret_ref: deepseek_api_key

  MOONSHOT_API_KEY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Primary Moonshot / Kimi provider API key. Required in staging/prod to keep the admitted provider credential surface complete.
    secret: true
    secret_ref: moonshot_api_key

  MINIMAX_API_KEY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Primary MiniMax provider API key. Required in staging/prod to keep the admitted provider credential surface complete.
    secret: true
    secret_ref: minimax_api_key

  MINIMAX_API_KEY_SECONDARY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Secondary MiniMax provider API key for ordered failover. Required in staging/prod to keep ordered credential fallback intact.
    secret: true
    secret_ref: minimax_api_key_secondary

  TENCENT_HUNYUAN_API_KEY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Primary Tencent Hunyuan provider API key. Required in staging/prod to keep the admitted provider credential surface complete.
    secret: true
    secret_ref: tencent_hunyuan_api_key

  ARK_API_KEY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Primary ByteDance Ark / Doubao provider API key. Required in staging/prod to keep the admitted provider credential surface complete.
    secret: true
    secret_ref: ark_api_key

  ARK_API_KEY_SECONDARY:
    type: string
    required: true
    scopes: [staging, prod]
    description: Secondary ByteDance Ark / Doubao provider API key for ordered failover. Required in staging/prod to keep ordered credential fallback intact.
    secret: true
    secret_ref: ark_api_key_secondary

  MEDIA_GENERATION_API_KEY:
    type: string
    required: false
    scopes: [dev, dev.local, staging, prod]
    description: API key for the dedicated image generation gateway.
    secret: true
    secret_ref: llm_api_pics

  LLM_VISION_API_KEY:
    type: string
    required: false
    scopes: [staging]
    description: Dedicated staging API key for multimodal image understanding and semantic extraction. LLM routing falls back to the primary DashScope credential when unavailable.
    secret: true
    secret_ref: llm_api_vision

  MEDIA_GENERATION_PROVIDER:
    type: string
    required: false
    default: ark-seedream
    description: Dedicated image generation provider identifier.

  MEDIA_GENERATION_MODEL:
    type: string
    required: false
    default: doubao-seedream-5-0-lite-260128
    description: Dedicated image generation model name.

  MEDIA_GENERATION_BASE_URL:
    type: string
    required: false
    default: https://ark.cn-beijing.volces.com
    description: Base URL for the dedicated image generation API.

  MEDIA_GENERATION_TIMEOUT_MS:
    type: int
    required: false
    default: 120000
    description: Timeout per image generation request in milliseconds.

  MEDIA_GENERATION_DOWNLOAD_TIMEOUT_MS:
    type: int
    required: false
    default: 30000
    description: Timeout for downloading provider-hosted generated image bytes.

  MEDIA_GENERATION_POLL_INTERVAL_MS:
    type: int
    required: false
    default: 150
    description: Poll interval for waiting on generation job completion.

  MEDIA_STORAGE_BACKEND:
    type: enum
    required: false
    default: local
    enum: [local, s3]
    description: Storage backend for persisted media assets.

  MEDIA_LOCAL_DIR:
    type: string
    required: false
    default: var/media-assets
    description: Local filesystem directory for persisted media assets when using local storage.

  MEDIA_PUBLIC_BASE_URL:
    type: string
    required: false
    description: Public base URL prefix for media assets served from object or local storage.

  MEDIA_S3_BUCKET:
    type: string
    required: false
    scopes: [staging, prod]
    description: S3 bucket for persisted media assets.

  MEDIA_S3_REGION:
    type: string
    required: false
    scopes: [staging, prod]
    default: us-east-1
    description: S3 region for persisted media assets.

  MEDIA_S3_ENDPOINT:
    type: string
    required: false
    scopes: [staging, prod]
    description: Optional custom S3-compatible endpoint for media asset storage.

  MEDIA_S3_FORCE_PATH_STYLE:
    type: bool
    required: false
    scopes: [staging, prod]
    default: false
    description: Whether media asset S3 access should force path-style URLs.

  MEDIA_S3_ACCESS_KEY_ID:
    type: string
    required: false
    scopes: [staging, prod]
    description: Access key id for media asset S3 storage.
    secret: true
    secret_ref: media_s3_access_key_id

  MEDIA_S3_SECRET_ACCESS_KEY:
    type: string
    required: false
    scopes: [staging, prod]
    description: Secret access key for media asset S3 storage.
    secret: true
    secret_ref: media_s3_secret_access_key

  MEDIA_GENERATION_WORKER_INTERVAL_MS:
    type: int
    required: false
    default: 5000
    description: Background media generation worker scan interval.

  MEDIA_GENERATION_WORKER_STARTUP_DELAY_MS:
    type: int
    required: false
    default: 2000
    description: Startup delay before the background media generation worker first tick.

  MEDIA_GENERATION_RUNNING_TIMEOUT_MS:
    type: int
    required: false
    default: 180000
    description: Running job timeout before the worker reclaims and marks the job timed out.

  MEDIA_GENERATION_GLOBAL_CONCURRENCY:
    type: int
    required: false
    default: 1
    description: Global concurrent media generation job cap.

  MEDIA_GENERATION_PROVIDER_CONCURRENCY:
    type: int
    required: false
    default: 1
    description: Per-provider concurrent media generation job cap.

  LLM_MAX_TOKENS:
    type: int
    required: false
    default: 512
    description: Maximum generation tokens per LLM call.

  LLM_TEMPERATURE:
    type: string
    required: false
    default: "0.8"
    description: LLM generation temperature.

  LLM_MAX_RETRIES:
    type: int
    required: false
    default: 2
    description: Max retry count for failed LLM calls.

  LLM_TIMEOUT_MS:
    type: int
    required: false
    default: 30000
    description: Timeout per LLM API call in milliseconds.

  RUNTIME_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable automatic startup of background runtime services on server start.

  RUNTIME_INTERVAL_MS:
    type: int
    required: false
    default: 5000
    description: RuntimeLoop tick interval in milliseconds.

  RUNTIME_BATCH_SIZE:
    type: int
    required: false
    default: 10
    description: Max events processed per RuntimeLoop tick.

  RUNTIME_POST_INTERVAL_MS:
    type: int
    required: false
    default: 120000
    description: Scheduler interval for autonomous post generation.

  RUNTIME_POST_MAX_PER_DAY:
    type: int
    required: false
    default: 50
    description: Daily cap for autonomous runtime posts.

  RUNTIME_QUEUE_BACKEND:
    type: enum
    enum: [in-memory, redis]
    required: false
    default: in-memory
    description: Runtime event queue backend selection.

  RUNTIME_LEADER_BACKEND:
    type: enum
    enum: [in-memory, redis]
    required: false
    default: in-memory
    description: Runtime leader election backend selection.

  RUNTIME_REDIS_URL:
    type: string
    required: false
    scopes: [staging, prod]
    description: Redis connection URL for runtime shared state.
    secret: true
    secret_ref: runtime_redis_url

  RUNTIME_REDIS_PREFIX:
    type: string
    required: false
    default: llm-forum:runtime
    description: Redis key prefix for runtime queue, DLQ, and lock keys.

  RUNTIME_REDIS_CONNECT_TIMEOUT_MS:
    type: int
    required: false
    default: 5000
    description: Redis connection timeout in milliseconds for runtime infra.

  RUNTIME_QUEUE_VISIBILITY_TIMEOUT_MS:
    type: int
    required: false
    default: 60000
    description: Pending message visibility timeout for runtime queue consumers.

  RUNTIME_QUEUE_MAX_RETRIES:
    type: int
    required: false
    default: 3
    description: Max retry attempts before moving runtime event to DLQ.

  RUNTIME_QUEUE_POLL_TIMEOUT_MS:
    type: int
    required: false
    default: 100
    description: Blocking poll timeout for queue dequeue operations.

  RUNTIME_LEADER_TTL_MS:
    type: int
    required: false
    default: 15000
    description: Lease TTL for runtime distributed leader locks.

  FF_GUIDANCE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Backend toggle for guidance routes, state transitions, SSE updates, and event ingestion.

  FF_GUIDANCE_RECALL_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Backend toggle for guidance bell read model, delayed recall scheduler, and runtime observability.

  CONTROL_PLANE_SCHEDULER_INTERVAL_MS:
    type: int
    required: false
    default: 30000
    description: Poll interval in milliseconds for community config scheduled activation.

  CONTROL_PLANE_SCHEDULER_STARTUP_DELAY_MS:
    type: int
    required: false
    default: 5000
    description: Startup delay in milliseconds before the first community config scheduler scan.

  CONTROL_PLANE_SCHEDULER_BATCH_LIMIT:
    type: int
    required: false
    default: 20
    description: Max scheduled config patches processed per scheduler tick.

  CONTROL_PLANE_SCHEDULER_MAX_RETRIES:
    type: int
    required: false
    default: 5
    description: Max retry attempts for failed scheduled config applications.

  CONTROL_PLANE_SCHEDULER_BACKOFF_BASE_MS:
    type: int
    required: false
    default: 30000
    description: Base exponential backoff delay in milliseconds for scheduler retries.

  CONTROL_PLANE_SCHEDULER_BACKOFF_MAX_MS:
    type: int
    required: false
    default: 900000
    description: Max retry backoff delay in milliseconds for scheduler retries.

  SSE_BROADCAST_BACKEND:
    type: enum
    enum: [local, redis]
    required: false
    default: local
    description: SSE broadcast backend selection for cross-instance fanout.

  SSE_REDIS_URL:
    type: string
    required: false
    scopes: [staging, prod]
    description: Redis connection URL for SSE cluster broadcast backend.
    secret: true
    secret_ref: sse_redis_url

  SSE_REDIS_CHANNEL:
    type: string
    required: false
    default: llm-forum:sse:broadcast
    description: Redis Pub/Sub channel name for SSE broadcast envelopes.

  SSE_REDIS_CONNECT_TIMEOUT_MS:
    type: int
    required: false
    default: 5000
    description: Redis connection timeout in milliseconds for SSE broadcast backend.

  FF_ALLOCATOR_PPR_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable allocator GraphRelevanceProvider (offline PPR snapshot) scoring term.

  FF_MEMBERSHIPS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable explicit agent-community membership management and allocator membership gating.

  FF_GLOBAL_HIGHLIGHTS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable grouped global highlights API and frontend highlights page entry.

  FF_HOME_PROGRAMMING_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable the launch programming home API and read-model routing for `/v1/home`.

  FF_PROGRAMMING_OPS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable the launch programming ops runtime, Admin Programming API, and `今晚节目单` schedule injection.

  FF_LIGHTWEIGHT_PERSONALIZATION_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable T-138 viewer-aware public view events, revisit signals, relation teasers, and readonly social summaries.

  FF_POST_LAUNCH_TUNING_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable T-139 post-launch runtime profile overlays across home, creator-note packaging, visual packaging, and incubation scoring.

  FF_POST_LAUNCH_TUNING_PROFILE:
    type: string
    required: false
    default: ""
    description: Active named post-launch tuning profile id. Empty falls back to the contract default profile.

  FF_SIGNAL_LOG_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable signal dual-write to agent_signal_logs and metrics-backed reads.

  FF_CASTING_DIRECTOR_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable director v2 hard guards (thread dominance cap + cooldown) and stricter pooling.

  FF_PPR_REFRESH_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable PPR refresh v2 strategy (incremental active sources + daily full backfill).

  FF_COMMUNITY_DIGEST_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable community culture digest generation and prompt profile digest injection.

  FF_RUNTIME_FEATURES_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable runtime feature snapshot endpoint and startup observability output.

  FF_CASTING_DIRECTOR_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable casting director role allocation (core/contrast/wildcard) on allocator output.

  FF_COMMUNITY_PROMPT_PROFILE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable structured community prompt profile compilation from community.rules_json.

  FF_CHRONICLE_SIGNAL_POLICY_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stricter chronicle signal visibility policy and public signal quality threshold.

  FF_CHRONICLE_METRICS_CACHE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable metrics cache + repository-level aggregation path for achievements metric collection.

  FF_PROMPT_AUDIT_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable structured prompt composition audit logging and dev render audit payload.

  FF_PERSONA_RUNTIME_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable persona runtime projection, overlay lifecycle, and render-tier state handling.

  FF_PERSONA_RUNTIME_SCENES:
    type: string
    required: false
    default: forum_post,forum_thread,forum_turn,chat_room,private_chat,proactive_dm,scheduled_post
    description: CSV whitelist of scenes where persona runtime state should participate.

  FF_PERSONA_WRITEBACK_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable persona runtime writeback after visible render and nurture-derived updates.

  FF_ACHIEVEMENT_CHRONICLE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable achievement + chronicle write pipeline and owner/admin read surfaces.

  FF_ACHIEVEMENT_PUBLIC_HIGHLIGHTS:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable public highlights endpoint and feed/profile badge/tagline exposure.

  FF_PUBLIC_OBSERVATION_MEMORY:
    type: enum
