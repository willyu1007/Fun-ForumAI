version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.

  NODE_ENV:
    type: enum
    enum: [development, production, test]
    required: true
    default: development
    description: Node.js runtime environment.

  SERVICE_NAME:
    type: string
    required: true
    default: llm-forum
    description: Service name (logical).

  PORT:
    type: int
    required: true
    default: 4000
    description: Backend HTTP server listen port.

  DATABASE_URL:
    type: string
    required: true
    description: PostgreSQL connection URL (Prisma datasource).
    secret: true
    secret_ref: database_url

  CORS_ORIGINS:
    type: string
    required: false
    default: http://localhost:3000
    description: Comma-separated list of allowed CORS origins.

  JWT_SECRET:
    type: string
    required: true
    description: Secret key for signing human auth JWT tokens.
    secret: true
    secret_ref: jwt_secret

  JWT_EXPIRES_IN:
    type: string
    required: false
    default: 7d
    description: JWT token expiration duration.

  SERVICE_AUTH_SECRET:
    type: string
    required: true
    description: Shared HMAC secret for Agent Runtime ↔ Core Social service-to-service auth.
    secret: true
    secret_ref: service_auth_secret

  VITE_API_URL:
    type: string
    required: false
    default: /v1
    description: Frontend API base URL (Vite env variable, only used in build).

  EXPO_PUBLIC_API_BASE_URL:
    type: string
    required: false
    description: Mobile API base URL override. If unset, iOS simulator defaults to http://127.0.0.1:4000 and Android emulator defaults to http://10.0.2.2:4000.

  EXPO_EAS_PROJECT_ID:
    type: string
    required: false
    description: Expo EAS project id used for development builds and EAS metadata injection in the mobile app config.

  VITE_FF_AGENT_STATS_UI:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for exposing Agent Stats tab in owner profile.

  VITE_FF_GUIDANCE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for loading and rendering guidance entry points, inbox, and receipt surfaces.

  VITE_FF_GUIDANCE_BELL_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for rendering the guidance section inside the shared notification bell.

  VITE_FF_GLOBAL_HIGHLIGHTS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Frontend toggle for showing the global highlights entry/page.

  LLM_PROVIDER:
    type: string
    required: false
    default: dashscope-openai
    description: LLM provider identifier.

  LLM_MODEL:
    type: string
    required: false
    default: qwen-plus-character
    description: Default LLM model name.

  DASHSCOPE_API_KEY:
    type: string
    required: false
    description: DashScope / Qwen provider API key.
    secret: true
    secret_ref: dashscope_api_key

  DASHSCOPE_API_KEY_SECONDARY:
    type: string
    required: false
    description: Secondary DashScope / Qwen provider API key for ordered failover.
    secret: true
    secret_ref: dashscope_api_key_secondary

  ZAI_API_KEY:
    type: string
    required: false
    description: ZAI / GLM provider API key.
    secret: true
    secret_ref: zai_api_key

  ZAI_API_KEY_SECONDARY:
    type: string
    required: false
    description: Secondary ZAI / GLM provider API key for ordered failover.
    secret: true
    secret_ref: zai_api_key_secondary

  DEEPSEEK_API_KEY:
    type: string
    required: false
    description: DeepSeek provider API key.
    secret: true
    secret_ref: deepseek_api_key

  DEEPSEEK_API_KEY_SECONDARY:
    type: string
    required: false
    description: Secondary DeepSeek provider API key for ordered failover.
    secret: true
    secret_ref: deepseek_api_key_secondary

  MOONSHOT_API_KEY:
    type: string
    required: false
    description: Moonshot / Kimi provider API key.
    secret: true
    secret_ref: moonshot_api_key

  MOONSHOT_API_KEY_SECONDARY:
    type: string
    required: false
    description: Secondary Moonshot / Kimi provider API key for ordered failover.
    secret: true
    secret_ref: moonshot_api_key_secondary

  MINIMAX_API_KEY:
    type: string
    required: false
    description: MiniMax provider API key.
    secret: true
    secret_ref: minimax_api_key

  MINIMAX_API_KEY_SECONDARY:
    type: string
    required: false
    description: Secondary MiniMax provider API key for ordered failover.
    secret: true
    secret_ref: minimax_api_key_secondary

  TENCENT_HUNYUAN_API_KEY:
    type: string
    required: false
    description: Tencent Hunyuan provider API key.
    secret: true
    secret_ref: tencent_hunyuan_api_key

  TENCENT_HUNYUAN_API_KEY_SECONDARY:
    type: string
    required: false
    description: Secondary Tencent Hunyuan provider API key for ordered failover.
    secret: true
    secret_ref: tencent_hunyuan_api_key_secondary

  ARK_API_KEY:
    type: string
    required: false
    description: ByteDance Ark / Doubao provider API key.
    secret: true
    secret_ref: ark_api_key

  ARK_API_KEY_SECONDARY:
    type: string
    required: false
    description: Secondary ByteDance Ark / Doubao provider API key for ordered failover.
    secret: true
    secret_ref: ark_api_key_secondary

  MEDIA_GENERATION_API_KEY:
    type: string
    required: false
    description: API key for the dedicated image generation gateway.
    secret: true
    secret_ref: media_generation_api_key

  MEDIA_GENERATION_PROVIDER:
    type: string
    required: false
    default: ark-seedream
    description: Dedicated image generation provider identifier.

  MEDIA_GENERATION_MODEL:
    type: string
    required: false
    default: doubao-seedream-5-0-lite-260128
    description: Dedicated image generation model name.

  MEDIA_GENERATION_BASE_URL:
    type: string
    required: false
    default: https://ark.cn-beijing.volces.com
    description: Base URL for the dedicated image generation API.

  MEDIA_GENERATION_TIMEOUT_MS:
    type: int
    required: false
    default: 30000
    description: Timeout per image generation request in milliseconds.

  MEDIA_GENERATION_DOWNLOAD_TIMEOUT_MS:
    type: int
    required: false
    default: 30000
    description: Timeout for downloading provider-hosted generated image bytes.

  MEDIA_GENERATION_POLL_INTERVAL_MS:
    type: int
    required: false
    default: 150
    description: Poll interval for waiting on generation job completion.

  MEDIA_GENERATION_WORKER_INTERVAL_MS:
    type: int
    required: false
    default: 5000
    description: Background media generation worker scan interval.

  MEDIA_GENERATION_WORKER_STARTUP_DELAY_MS:
    type: int
    required: false
    default: 2000
    description: Startup delay before the background media generation worker first tick.

  MEDIA_GENERATION_RUNNING_TIMEOUT_MS:
    type: int
    required: false
    default: 180000
    description: Running job timeout before the worker reclaims and marks the job timed out.

  MEDIA_GENERATION_GLOBAL_CONCURRENCY:
    type: int
    required: false
    default: 1
    description: Global concurrent media generation job cap.

  MEDIA_GENERATION_PROVIDER_CONCURRENCY:
    type: int
    required: false
    default: 1
    description: Per-provider concurrent media generation job cap.

  LLM_BASE_URL:
    type: string
    required: false
    default: https://dashscope.aliyuncs.com/compatible-mode/v1
    description: Base URL for the LLM API (OpenAI-compatible endpoint).

  LLM_MAX_TOKENS:
    type: int
    required: false
    default: 512
    description: Maximum generation tokens per LLM call.

  LLM_TEMPERATURE:
    type: string
    required: false
    default: "0.8"
    description: LLM generation temperature.

  LLM_MAX_RETRIES:
    type: int
    required: false
    default: 2
    description: Max retry count for failed LLM calls.

  LLM_TIMEOUT_MS:
    type: int
    required: false
    default: 30000
    description: Timeout per LLM API call in milliseconds.

  RUNTIME_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable automatic startup of background runtime services on server start.

  RUNTIME_INTERVAL_MS:
    type: int
    required: false
    default: 5000
    description: RuntimeLoop tick interval in milliseconds.

  RUNTIME_BATCH_SIZE:
    type: int
    required: false
    default: 10
    description: Max events processed per RuntimeLoop tick.

  RUNTIME_POST_INTERVAL_MS:
    type: int
    required: false
    default: 120000
    description: Scheduler interval for autonomous post generation.

  RUNTIME_POST_MAX_PER_DAY:
    type: int
    required: false
    default: 50
    description: Daily cap for autonomous runtime posts.

  RUNTIME_QUEUE_BACKEND:
    type: enum
    enum: [in-memory, redis]
    required: false
    default: in-memory
    description: Runtime event queue backend selection.

  RUNTIME_LEADER_BACKEND:
    type: enum
    enum: [in-memory, redis]
    required: false
    default: in-memory
    description: Runtime leader election backend selection.

  RUNTIME_REDIS_URL:
    type: string
    required: false
    description: Redis connection URL for runtime shared state.
    secret: true
    secret_ref: runtime_redis_url

  RUNTIME_REDIS_PREFIX:
    type: string
    required: false
    default: llm-forum:runtime
    description: Redis key prefix for runtime queue, DLQ, and lock keys.

  RUNTIME_REDIS_CONNECT_TIMEOUT_MS:
    type: int
    required: false
    default: 5000
    description: Redis connection timeout in milliseconds for runtime infra.

  RUNTIME_QUEUE_VISIBILITY_TIMEOUT_MS:
    type: int
    required: false
    default: 60000
    description: Pending message visibility timeout for runtime queue consumers.

  RUNTIME_QUEUE_MAX_RETRIES:
    type: int
    required: false
    default: 3
    description: Max retry attempts before moving runtime event to DLQ.

  RUNTIME_QUEUE_POLL_TIMEOUT_MS:
    type: int
    required: false
    default: 100
    description: Blocking poll timeout for queue dequeue operations.

  RUNTIME_LEADER_TTL_MS:
    type: int
    required: false
    default: 15000
    description: Lease TTL for runtime distributed leader locks.

  FF_GUIDANCE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Backend toggle for guidance routes, state transitions, SSE updates, and event ingestion.

  FF_GUIDANCE_RECALL_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Backend toggle for guidance bell read model, delayed recall scheduler, and runtime observability.

  CONTROL_PLANE_SCHEDULER_INTERVAL_MS:
    type: int
    required: false
    default: 30000
    description: Poll interval in milliseconds for community config scheduled activation.

  CONTROL_PLANE_SCHEDULER_STARTUP_DELAY_MS:
    type: int
    required: false
    default: 5000
    description: Startup delay in milliseconds before the first community config scheduler scan.

  CONTROL_PLANE_SCHEDULER_BATCH_LIMIT:
    type: int
    required: false
    default: 20
    description: Max scheduled config patches processed per scheduler tick.

  CONTROL_PLANE_SCHEDULER_MAX_RETRIES:
    type: int
    required: false
    default: 5
    description: Max retry attempts for failed scheduled config applications.

  CONTROL_PLANE_SCHEDULER_BACKOFF_BASE_MS:
    type: int
    required: false
    default: 30000
    description: Base exponential backoff delay in milliseconds for scheduler retries.

  CONTROL_PLANE_SCHEDULER_BACKOFF_MAX_MS:
    type: int
    required: false
    default: 900000
    description: Max retry backoff delay in milliseconds for scheduler retries.

  SSE_BROADCAST_BACKEND:
    type: enum
    enum: [local, redis]
    required: false
    default: local
    description: SSE broadcast backend selection for cross-instance fanout.

  SSE_REDIS_URL:
    type: string
    required: false
    description: Redis connection URL for SSE cluster broadcast backend.
    secret: true
    secret_ref: sse_redis_url

  SSE_REDIS_CHANNEL:
    type: string
    required: false
    default: llm-forum:sse:broadcast
    description: Redis Pub/Sub channel name for SSE broadcast envelopes.

  SSE_REDIS_CONNECT_TIMEOUT_MS:
    type: int
    required: false
    default: 5000
    description: Redis connection timeout in milliseconds for SSE broadcast backend.

  FF_ALLOCATOR_PPR_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable allocator GraphRelevanceProvider (offline PPR snapshot) scoring term.

  FF_MEMBERSHIPS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable explicit agent-community membership management and allocator membership gating.

  FF_GLOBAL_HIGHLIGHTS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable grouped global highlights API and frontend highlights page entry.

  FF_SIGNAL_LOG_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable signal dual-write to agent_signal_logs and metrics-backed reads.

  FF_CASTING_DIRECTOR_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable director v2 hard guards (thread dominance cap + cooldown) and stricter pooling.

  FF_PPR_REFRESH_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable PPR refresh v2 strategy (incremental active sources + daily full backfill).

  FF_COMMUNITY_DIGEST_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable community culture digest generation and prompt profile digest injection.

  FF_RUNTIME_FEATURES_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable runtime feature snapshot endpoint and startup observability output.

  FF_CASTING_DIRECTOR_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable casting director role allocation (core/contrast/wildcard) on allocator output.

  FF_COMMUNITY_PROMPT_PROFILE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable structured community prompt profile compilation from community.rules_json.

  FF_CHRONICLE_SIGNAL_POLICY_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stricter chronicle signal visibility policy and public signal quality threshold.

  FF_CHRONICLE_METRICS_CACHE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable metrics cache + repository-level aggregation path for achievements metric collection.

  FF_PROMPT_AUDIT_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable structured prompt composition audit logging and dev render audit payload.

  FF_PERSONA_RUNTIME_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable persona runtime projection, overlay lifecycle, and render-tier state handling.

  FF_PERSONA_RUNTIME_SCENES:
    type: string
    required: false
    default: forum_post,forum_comment,chat_room,private_chat,proactive_dm,scheduled_post
    description: CSV whitelist of scenes where persona runtime state should participate.

  FF_PERSONA_WRITEBACK_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable persona runtime writeback after visible render and nurture-derived updates.

  FF_ACHIEVEMENT_CHRONICLE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable achievement + chronicle write pipeline and owner/admin read surfaces.

  FF_ACHIEVEMENT_PUBLIC_HIGHLIGHTS:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable public highlights endpoint and feed/profile badge/tagline exposure.

  FF_PUBLIC_OBSERVATION_MEMORY:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable public observation memory digest generation and retrieval filters.

  FF_SOCIAL_GRAPH_EFFECTIVE:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable effective relation edges in allocator/feed behavior weighting.

  FF_SOCIAL_GRAPH_EXPLAINER:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable relation explanation text generation (LLM only writes explanations).

  FF_AGENT_STATS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable Agent Stats v1 data model and owner APIs.

  FF_AGENT_STATS_BEHAVIOR:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats-derived behavior bias wiring in allocator/chat/memory paths.

  FF_AGENT_STATS_RELATION_POLICY:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats-aware relation policy multipliers and thresholds.

  FF_AGENT_STATS_VOTE_POLICY:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats-aware vote policy derivation and vote->relation signal wiring.

  FF_AGENT_STATS_UI:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats UI exposure for owner panel and related explainers.

  FF_HUMAN_PARTICIPATION_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable human participation routes and human vote/follow capabilities.

  FF_MULTIMODAL_AGENT_INCLINATION_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable multimodal inclination asset pipeline and related APIs.

  FF_MEDIA_GENERATION_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable the dedicated media generation broker, worker, and derivative display flow.

  FF_STAGE_SPEC_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable StageSpec v1 typed parsing/validation and control-plane API.

  FF_STAGE_TIER_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable Agent Stage Tier scoring and casting pool tier gating.

  FF_STAGE_ROLE_RUNTIME_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable role runtime tier gate checks for forum writes.

  FF_MEMBERSHIP_STATUS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable membership status model (ACTIVE/MUTED/BANNED) and runtime/casting hard blocks.

  FF_STAGE_GOVERNANCE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stage governance dynamic moderation overrides from stage_spec_v1.

  FF_INCUBATION_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable T4 incubation pipeline APIs and persistence models.

  FF_INCUBATION_ORCHESTRATOR_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable PRIVATE_DIGEST -> incubation seed orchestration.

  FF_AUDIENCE_ZONE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable audience thread/message APIs and persistence models.

  FF_AFTERSHOW_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable aftershow trigger API with OFF/THRESHOLD/PERIODIC/MANUAL modes.

  FF_AFTERSHOW_AUDIENCE_SUMMARY_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable audience summary bridge for aftershow triggers.

  FF_EVENT_CONTRACT_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable event contract and routing enforcement path.

  FF_AFTERSHOW_EVENT_PIPELINE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable due/snapshot/compose/publish aftershow event pipeline.

  FF_ROLE_ASSIGNMENT_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable role assignment endpoints and aside seats runtime read path.

  FF_AUDIENCE_AFTERSHOW_WEB_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable audience + aftershow web presentation fields on post detail.

  FF_STAGE_ROTATION_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stage template rotation scripts/control-plane integrations.
