  MEDIA_ROOT_POST_TARGET_MIN_RATE:
    type: float
    required: false
    default: 0.35
    description: Lower bound of the desired 7d root-post display attach rate.

  MEDIA_ROOT_POST_TARGET_MAX_RATE:
    type: float
    required: false
    default: 0.45
    description: Upper bound of the desired 7d root-post display attach rate.

