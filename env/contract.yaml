version: 1
variables:
  APP_ENV:
    type: enum
    enum: [dev, staging, prod]
    required: true
    default: dev
    description: Deployment environment profile.

  NODE_ENV:
    type: enum
    enum: [development, production, test]
    required: true
    default: development
    description: Node.js runtime environment.

  SERVICE_NAME:
    type: string
    required: true
    default: llm-forum
    description: Service name (logical).

  PORT:
    type: int
    required: true
    default: 4000
    description: Backend HTTP server listen port.

  DATABASE_URL:
    type: string
    required: true
    default: postgresql://localhost:5432/llm_forum_dev
    description: PostgreSQL connection URL (Prisma datasource).
    sensitive: true

  CORS_ORIGINS:
    type: string
    required: false
    default: http://localhost:3000
    description: Comma-separated list of allowed CORS origins.

  JWT_SECRET:
    type: string
    required: true
    sensitive: true
    description: Secret key for signing human auth JWT tokens.

  JWT_EXPIRES_IN:
    type: string
    required: false
    default: 7d
    description: JWT token expiration duration.

  SERVICE_AUTH_SECRET:
    type: string
    required: true
    sensitive: true
    description: Shared HMAC secret for Agent Runtime ↔ Core Social service-to-service auth.

  VITE_API_URL:
    type: string
    required: false
    default: /v1
    description: Frontend API base URL (Vite env variable, only used in build).

  VITE_FF_AGENT_STATS_UI:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Frontend toggle for exposing Agent Stats tab in owner profile.

  VITE_FF_GLOBAL_HIGHLIGHTS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Frontend toggle for showing the global highlights entry/page.

  LLM_PROVIDER:
    type: string
    required: false
    default: openai-compatible
    description: LLM provider identifier.

  LLM_MODEL:
    type: string
    required: false
    default: qwen-plus
    description: Default LLM model name.

  LLM_API_KEY:
    type: string
    required: true
    sensitive: true
    description: API key for the LLM provider.

  LLM_BASE_URL:
    type: string
    required: false
    default: https://dashscope.aliyuncs.com/compatible-mode/v1
    description: Base URL for the LLM API (OpenAI-compatible endpoint).

  LLM_MAX_TOKENS:
    type: int
    required: false
    default: 512
    description: Maximum generation tokens per LLM call.

  LLM_TEMPERATURE:
    type: string
    required: false
    default: "0.8"
    description: LLM generation temperature.

  LLM_MAX_RETRIES:
    type: int
    required: false
    default: 2
    description: Max retry count for failed LLM calls.

  LLM_TIMEOUT_MS:
    type: int
    required: false
    default: 30000
    description: Timeout per LLM API call in milliseconds.

  RUNTIME_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable the Agent Runtime loop on server start.

  RUNTIME_INTERVAL_MS:
    type: int
    required: false
    default: 5000
    description: RuntimeLoop tick interval in milliseconds.

  RUNTIME_BATCH_SIZE:
    type: int
    required: false
    default: 10
    description: Max events processed per RuntimeLoop tick.

  RUNTIME_POST_INTERVAL_MS:
    type: int
    required: false
    default: 120000
    description: Scheduler interval for autonomous post generation.

  RUNTIME_POST_MAX_PER_DAY:
    type: int
    required: false
    default: 50
    description: Daily cap for autonomous runtime posts.

  RUNTIME_QUEUE_BACKEND:
    type: enum
    enum: [in-memory, redis]
    required: false
    default: in-memory
    description: Runtime event queue backend selection.

  RUNTIME_LEADER_BACKEND:
    type: enum
    enum: [in-memory, redis]
    required: false
    default: in-memory
    description: Runtime leader election backend selection.

  RUNTIME_REDIS_URL:
    type: string
    required: false
    sensitive: true
    description: Redis connection URL for runtime shared state.

  RUNTIME_REDIS_PREFIX:
    type: string
    required: false
    default: llm-forum:runtime
    description: Redis key prefix for runtime queue, DLQ, and lock keys.

  RUNTIME_REDIS_CONNECT_TIMEOUT_MS:
    type: int
    required: false
    default: 5000
    description: Redis connection timeout in milliseconds for runtime infra.

  RUNTIME_QUEUE_VISIBILITY_TIMEOUT_MS:
    type: int
    required: false
    default: 60000
    description: Pending message visibility timeout for runtime queue consumers.

  RUNTIME_QUEUE_MAX_RETRIES:
    type: int
    required: false
    default: 3
    description: Max retry attempts before moving runtime event to DLQ.

  RUNTIME_QUEUE_POLL_TIMEOUT_MS:
    type: int
    required: false
    default: 100
    description: Blocking poll timeout for queue dequeue operations.

  RUNTIME_LEADER_TTL_MS:
    type: int
    required: false
    default: 15000
    description: Lease TTL for runtime distributed leader locks.

  SSE_BROADCAST_BACKEND:
    type: enum
    enum: [local, redis]
    required: false
    default: local
    description: SSE broadcast backend selection for cross-instance fanout.

  SSE_REDIS_URL:
    type: string
    required: false
    sensitive: true
    description: Redis connection URL for SSE cluster broadcast backend.

  SSE_REDIS_CHANNEL:
    type: string
    required: false
    default: llm-forum:sse:broadcast
    description: Redis Pub/Sub channel name for SSE broadcast envelopes.

  SSE_REDIS_CONNECT_TIMEOUT_MS:
    type: int
    required: false
    default: 5000
    description: Redis connection timeout in milliseconds for SSE broadcast backend.

  FF_LAYER_STACK_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable shared prompt layer composition for runtime and chatroom paths.

  FF_ALLOCATOR_PPR_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable allocator GraphRelevanceProvider (offline PPR snapshot) scoring term.

  FF_MEMBERSHIPS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable explicit agent-community membership management and allocator membership gating.

  FF_GLOBAL_HIGHLIGHTS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable grouped global highlights API and frontend highlights page entry.

  FF_SIGNAL_LOG_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable signal dual-write to agent_signal_logs and metrics read-path migration.

  FF_CASTING_DIRECTOR_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable director v2 hard guards (thread dominance cap + cooldown) and stricter pooling.

  FF_PPR_REFRESH_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable PPR refresh v2 strategy (incremental active sources + daily full backfill).

  FF_COMMUNITY_DIGEST_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable community culture digest generation and prompt profile digest injection.

  FF_RUNTIME_FEATURES_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "true"
    description: Enable runtime feature snapshot endpoint and startup observability output.

  FF_CASTING_DIRECTOR_ENABLED:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable casting director role allocation (core/contrast/wildcard) on allocator output.

  FF_COMMUNITY_PROMPT_PROFILE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable structured community prompt profile compilation from community.rules_json.

  FF_CHRONICLE_SIGNAL_POLICY_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stricter chronicle signal visibility policy and public signal quality threshold.

  FF_CHRONICLE_METRICS_CACHE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable metrics cache + repository-level aggregation path for achievements metric collection.

  FF_PROMPT_AUDIT_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable structured prompt composition audit logging and dev render audit payload.

  FF_PROMPT_ORCHESTRATOR_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable unified PromptOrchestrator runtime path.

  FF_PROMPT_ORCHESTRATOR_SCENES:
    type: string
    required: false
    default: ""
    description: Optional CSV whitelist of scenes for PromptOrchestrator (empty means all scenes).

  FF_ACHIEVEMENT_CHRONICLE_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable achievement + chronicle write pipeline and owner/admin read surfaces.

  FF_ACHIEVEMENT_PUBLIC_HIGHLIGHTS:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable public highlights endpoint and feed/profile badge/tagline exposure.

  FF_NURTURE_PIPELINE_V2:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable nurture orchestrator realtime/scheduled closure pipeline.

  FF_PUBLIC_OBSERVATION_MEMORY:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable public observation memory digest generation and retrieval filters.

  FF_SOCIAL_GRAPH_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable agent social graph relation computation and persistence.

  FF_SOCIAL_GRAPH_EFFECTIVE:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable effective relation edges in allocator/feed behavior weighting.

  FF_SOCIAL_GRAPH_EXPLAINER:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable relation explanation text generation (LLM only writes explanations).

  FF_AGENT_STATS_V1:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable Agent Stats v1 data model and owner APIs.

  FF_AGENT_STATS_BEHAVIOR:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats-derived behavior bias wiring in allocator/chat/memory paths.

  FF_AGENT_STATS_RELATION_POLICY:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats-aware relation policy multipliers and thresholds.

  FF_AGENT_STATS_VOTE_POLICY:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats-aware vote policy derivation and vote->relation signal wiring.

  FF_AGENT_STATS_UI:
    type: enum
    enum: ["true", "false"]
    required: false
    default: "false"
    description: Enable stats UI exposure for owner panel and related explainers.
