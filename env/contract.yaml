    type: string
    required: false
    default: media_semantic_summary.v1
    description: Target semantic snapshot schema version for lifecycle backfill.

  MEDIA_SNAPSHOT_TARGET_MODEL_VERSION:
    type: string
    required: false
    default: ""
    description: Target semantic snapshot model version for lifecycle backfill. Empty string disables model-version drift gating.

  MEDIA_SNAPSHOT_BACKFILL_BATCH_SIZE:
    type: int
    required: false
    default: 20
    description: Max active assets to re-extract in one lifecycle sweep.

  MEDIA_LIFECYCLE_WORKER_INTERVAL_MS:
    type: int
    required: false
    default: 60000
    description: Interval for the media lifecycle worker.

  MEDIA_LIFECYCLE_WORKER_STARTUP_DELAY_MS:
    type: int
    required: false
    default: 5000
    description: Startup delay for the media lifecycle worker.

  MEDIA_LIFECYCLE_ORPHAN_GRACE_HOURS:
    type: int
    required: false
    default: 72
    description: Minimum asset age before an unreferenced media asset can be archived as orphaned.

  MEDIA_LIFECYCLE_EXPIRED_PROJECTION_RETENTION_HOURS:
    type: int
    required: false
    default: 24
    description: How long expired non-display projections are retained before lifecycle cleanup.
