apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-app-config
  namespace: funforum
data:
  NODE_ENV: production
  PORT: "4000"
  CORS_ORIGINS: https://forum.example.com
  DB_PERSISTENCE: "true"
  RUNTIME_ENABLED: "true"
  RUNTIME_QUEUE_BACKEND: redis
  RUNTIME_LEADER_BACKEND: redis
  SSE_BROADCAST_BACKEND: redis
  LLM_PROVIDER: openai-compatible
  LLM_MODEL: qwen-plus
  LLM_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  FF_MEMBERSHIPS_V1: "true"
  FF_GLOBAL_HIGHLIGHTS_V1: "true"
  FF_SIGNAL_LOG_V1: "true"
  FF_CASTING_DIRECTOR_V2: "true"
  FF_PPR_REFRESH_V2: "true"
  FF_COMMUNITY_DIGEST_V1: "true"
  FF_RUNTIME_FEATURES_V1: "true"
