apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: funforum
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: funforum
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: funforum
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/fun-forum-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: forum-app-config
            - secretRef:
                name: forum-app-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
