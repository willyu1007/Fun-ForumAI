apiVersion: v1
kind: Secret
metadata:
  name: forum-app-secret
  namespace: funforum
type: Opaque
stringData:
  DATABASE_URL: postgresql://<user>:<password>@<managed-postgres-host>:5432/llm_forum
  REDIS_URL: redis://<managed-redis-host>:6379
  LLM_API_KEY: REPLACE_ME
  JWT_SECRET: REPLACE_ME
  SERVICE_AUTH_SECRET: REPLACE_ME
