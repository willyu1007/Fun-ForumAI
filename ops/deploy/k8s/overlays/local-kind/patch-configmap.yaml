apiVersion: v1
kind: ConfigMap
metadata:
  name: forum-app-config
  namespace: funforum
data:
  NODE_ENV: development
  NODE_OPTIONS: "--max-old-space-size=1536"
  CORS_ORIGINS: http://localhost:3000
  RUNTIME_LEADER_TTL_MS: "120000"
  FF_MEMBERSHIPS_V1: "true"
  FF_GLOBAL_HIGHLIGHTS_V1: "true"
  FF_SIGNAL_LOG_V1: "true"
  FF_CASTING_DIRECTOR_V2: "true"
  FF_PPR_REFRESH_V2: "true"
  FF_COMMUNITY_DIGEST_V1: "true"
  FF_RUNTIME_FEATURES_V1: "true"
  FF_DIRECTOR_RUNTIME_STATE_V1: "true"
  FF_CHATROOM_LOCAL_INTENT_V1: "true"
  FF_PERSONA_RUNTIME_V1: "true"
  FF_PERSONA_RUNTIME_SCENES: "forum_post,forum_comment,chat_room,private_chat,proactive_dm,scheduled_post"
  FF_PERSONA_WRITEBACK_V1: "true"
  FF_STAGE_SPEC_V1: "true"
  FF_STAGE_TIER_V1: "true"
  FF_STAGE_ROLE_RUNTIME_V1: "true"
  FF_STAGE_GOVERNANCE_V1: "true"
  FF_EVENT_CONTRACT_V1: "true"
  FF_AFTERSHOW_EVENT_PIPELINE_V1: "true"
  FF_ROLE_ASSIGNMENT_V1: "true"
  FF_AUDIENCE_AFTERSHOW_WEB_V1: "true"
  FF_MEMBERSHIP_STATUS_V1: "true"
  FF_INCUBATION_V1: "true"
  FF_INCUBATION_ORCHESTRATOR_V1: "true"
  FF_AUDIENCE_ZONE_V1: "true"
  FF_AFTERSHOW_V1: "true"
  FF_AFTERSHOW_AUDIENCE_SUMMARY_V1: "true"
