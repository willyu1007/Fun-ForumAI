apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pg18
  namespace: funforum
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: funforum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          command:
            - /bin/sh
            - -lc
          args:
            - |
              set -e
              if [ ! -f /usr/local/share/postgresql/extension/vector.control ] || [ ! -f /usr/local/lib/postgresql/vector.so ]; then
                apk add --no-cache postgresql-pgvector
                mkdir -p /usr/local/share/postgresql/extension /usr/local/lib/postgresql
                cp -f /usr/share/postgresql18/extension/vector* /usr/local/share/postgresql/extension/
                cp -f /usr/lib/postgresql18/vector.so /usr/local/lib/postgresql/
              fi
              exec docker-entrypoint.sh postgres
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
            - name: POSTGRES_DB
              value: llm_forum
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data-pg18
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: funforum
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
