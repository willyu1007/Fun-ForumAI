<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="100%" viewBox="2 2 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="titanium-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1D5DB" />
      <stop offset="25%" stop-color="#4B5563" />
      <stop offset="50%" stop-color="#1F2937" />
      <stop offset="75%" stop-color="#6B7280" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>

    <linearGradient id="base-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <pattern id="tech-grid" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M4 0 L0 0 L0 4" fill="none" stroke="#1F2937" stroke-width="0.5" />
    </pattern>

    <filter id="inner-shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <polygon points="20,4 44,4 60,20 60,40 44,56 20,56 4,40 4,20" fill="url(#base-bg)" stroke="url(#titanium-border)" stroke-width="2.5" filter="url(#drop-shadow)" />
  
  <polygon points="21.5,6 42.5,6 57.5,21 57.5,39 42.5,54 21.5,54 6.5,39 6.5,21" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.8" />

  <polygon points="23,8 41,8 55,22 55,38 41,52 23,52 9,38 9,22" fill="#0B1120" filter="url(#inner-shadow)" />
  <polygon points="23,8 41,8 55,22 55,38 41,52 23,52 9,38 9,22" fill="url(#tech-grid)" opacity="0.8" />

  <!-- 移除了错误的 fill 填充，纯粹使用 stroke 描边来实现霓虹线条感 -->
  <g transform="translate(15.799999999999997, 9) scale(1.35)" filter="url(#neon-glow)" opacity="0.8">
    <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M20 20v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="#0EA5E9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <g transform="translate(15.799999999999997, 9) scale(1.35)">
    <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M20 20v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" fill="none" stroke="#E0F2FE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <g>
    <text x="32" y="50" font-family="Impact, Arial Black, sans-serif" font-size="10" font-weight="900" fill="#0EA5E9" text-anchor="middle" letter-spacing="1.5" filter="url(#neon-glow)">PA</text>
    <text x="32" y="50" font-family="Impact, Arial Black, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PA</text>
  </g>

  <polygon points="28,4 36,4 34,6 30,6" fill="#0EA5E9" filter="url(#neon-glow)" opacity="0.8" />
</svg>